# VPS production stack. Copy .env.production.example to .env.production before use.
# Run: docker compose --env-file .env.production -f compose.production.yml up -d --build
x-api-common: &api-common
  image: serpente-api:local
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env.production

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME}
      MYSQL_USER: ${DB_USER:?Set DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - private

  migrate:
    <<: *api-common
    restart: "no"
    command: ["npm", "run", "migration:run"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private

  api:
    <<: *api-common
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s
    networks:
      - private

  frontend:
    image: serpente-web:local
    build:
      context: .
      dockerfile: deploy/vps/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://api:3000
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://api:3000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 60s
    networks:
      - private

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - private

  retention:
    <<: *api-common
    restart: unless-stopped
    # Run once after startup, then every 24h; database is never exposed publicly.
    command: ["sh", "-c", "while true; do node dist/jobs/retention-cleanup.js; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private

volumes:
  mysql_data:
  caddy_data:
  caddy_config:

networks:
  private:
    driver: bridge
