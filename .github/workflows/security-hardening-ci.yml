name: Security Hardening CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsx --test src/tests/trusted-login-device.test.ts
      - run: npx tsx --test src/tests/trusted-origins.test.ts
      - run: npx tsx --test src/tests/availability-rate-limit.test.ts
      - run: npx tsx --test src/tests/all-rate-limits.test.ts
      - run: npx tsx --test src/tests/booking-notification.test.ts
      - run: npx tsx --test src/tests/admin-appointment-filters.test.ts
      - run: npx tsx --test src/tests/role-permissions.test.ts
      - run: npx tsx --test src/tests/media-validation.test.ts
      - run: npx tsx --test src/tests/staff-working-hours.test.ts
      - run: npx tsx --test src/tests/staff-update-validation.test.ts
      - run: npx tsx --test src/tests/walk-ins.dto.test.ts
      - run: npm run build
      - run: npm audit --audit-level=high

  backend-mysql-integration:
    name: Booking concurrency (MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: public.ecr.aws/docker/library/mysql:8.0
        env:
          MYSQL_DATABASE: nail_salon_integration_test
          MYSQL_ROOT_PASSWORD: ci-integration-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-integration-only-password"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=25
    env:
      RUN_BOOKING_INTEGRATION_TESTS: "1"
      NODE_ENV: development
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ci-integration-only-password
      DB_NAME: nail_salon_integration_test
      DB_SYNCHRONIZE: "false"
      DB_LOGGING: "false"
      JWT_SECRET: ci-local-integration-test-key-never-used-in-production
      CORS_ORIGIN: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply production TypeORM migrations to ephemeral MySQL
        run: npm run migration:run
      - name: Run booking concurrency integration tests
        run: npm run test:booking:integration
      - name: Test walk-in and group actual pricing on ephemeral MySQL
        run: npx tsx --test src/tests/walk-ins.integration.test.ts
      - name: Verify MySQL media BLOB lifecycle
        run: npx tsx --test src/tests/media-storage.integration.test.ts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://api:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --experimental-strip-types --test scripts/test-staff-login.mjs
      - run: node --experimental-strip-types --test scripts/test-session-recovery.mjs
      - run: node scripts/check-service-typography.mjs
      - run: node scripts/check-production-domain.mjs
      - run: node scripts/check-no-viewport-position.mjs
      - run: npx tsc --noEmit
      - run: node --test scripts/check-responsive-layout.mjs
      - run: npm run build
      - name: Verify fluid layouts in Chrome at 360–1280px
        run: node scripts/check-responsive-browser.mjs
      - name: Verify booking modal actions fit mobile viewports
        run: node scripts/check-booking-modal-browser.mjs
      - name: Save responsive browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-layout-screenshots
          path: frontend/responsive-artifacts/
          if-no-files-found: ignore
      - run: node scripts/check-csp.mjs
      - run: node scripts/audit-ci.mjs

  vps-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose production stack
        run: |
          cp .env.production.example .env.production
          docker compose --env-file .env.production -f compose.production.yml config --quiet
      - name: Check backup shell syntax
        run: bash -n deploy/vps/backup.sh
